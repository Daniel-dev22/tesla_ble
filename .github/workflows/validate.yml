name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  # HACS validation. This validates manifest.json required fields, hacs.json
  # (including content_in_root) and the overall repository layout.
  #
  # Note: the home-assistant hassfest action is intentionally NOT run here. It
  # assumes the standard custom_components/<domain>/ layout and currently fails
  # on content_in_root repositories (home-assistant/core#152942). If this repo is
  # ever restructured into custom_components/tesla_ble/, add a hassfest job back.
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  # Unit tests. Previously nothing ran pytest, so the suite silently rotted
  # against the code it was meant to guard (stale attribute names, a test that
  # hung forever on a real BLE connector). Keep this job green.
  #
  # The checkout directory must be named `tesla_ble`: this is a content_in_root
  # repository, so the repo root IS the package, and the tests import it as such.
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tesla_ble
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install pytest pytest-asyncio pytest-timeout protobuf cryptography bleak-retry-connector
      - name: Run tests
        working-directory: tesla_ble
        run: python -m pytest -q --timeout=60
