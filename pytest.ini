[pytest]
# Run from the repository root:  python -m pytest
#
# `python -m pytest` puts the repo root on sys.path[0], which is what makes the
# root-level `ha_stubs` module importable as an early plugin. The stubs must be
# installed before pytest imports the `tesla_ble` package, since the package
# imports `homeassistant` at module scope.
addopts = -p ha_stubs
testpaths = tests
# Tests carry explicit @pytest.mark.asyncio markers, so strict (the default) is
# correct. Do not switch to `auto`: it also rewrites fixtures and hangs this suite.
asyncio_mode = strict
